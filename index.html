<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> 1 Year </title>

  <!-- password gate: redirect to lock.html if not unlocked -->
  <script>
    if (sessionStorage.getItem('anniversaryUnlocked') !== 'true') {
      window.location.href = 'lock.html';
    }
  </script>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="spotify-player.css" />
</head>
<body>

<div class="anniversary-header">
  <h1> 1 year of us</h1>
  <p>a collage of little moments</p>

  <div class="love-counter" id="loveCounter" aria-live="polite">
    <div class="counter-unit"><span id="counterYears">0</span><label>years</label></div>
    <div class="counter-unit"><span id="counterMonths">0</span><label>months</label></div>
    <div class="counter-unit"><span id="counterDays">0</span><label>days</label></div>
    <div class="counter-unit"><span id="counterHours">0</span><label>hours</label></div>
    <div class="counter-unit"><span id="counterMinutes">0</span><label>minutes</label></div>
    <div class="counter-unit"><span id="counterSeconds">0</span><label>seconds</label></div>
  </div>
</div>

<!-- collage grid -->
<div class="collage-grid" id="collageGrid">
</div>

<!-- subtle footer -->
<div class="footer-note">
  <span>✧ every memory, a little piece of us ✧</span>
</div>

<!-- open playlist in Spotify -->
<div class="spotify-dock" id="spotifyDock">
  <div class="spotify-header">
    <div class="spotify-label">
      <span class="spotify-note">♫</span>
      <span>our playlist</span>
    </div>
    <button class="spotify-toggle" id="spotifyToggle" aria-label="Collapse player">—</button>
  </div>
  <div class="spotify-body">
    <a
      class="spotify-open-btn"
      id="spotifyOpenBtn"
      href="https://open.spotify.com/playlist/0vqVx4FJZIeyNYZuZfd49U?si=8fc15752178e43af"
      target="_blank"
      rel="noopener noreferrer">
      <svg class="spotify-open-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.5 17.3a.75.75 
        0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.55-1.15a.75.75 0 1 1-.33-1.46c4.55-1.04 8.47-.59 11.66 1.36.35.22.46.68.25 
        1zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.98-8.15-2.56-11.97-1.4a.94.94 0 1 1-.54-1.8c4.36-1.32 9.77-.68 13.48 
        1.6.44.27.58.85.32 1.29zm.13-3.4C15.24 8.3 8.85 8.08 5.23 9.18a1.12 1.12 0 1 1-.65-2.15c4.15-1.26 11.22-1.02 
        15.62 1.6a1.12 1.12 0 0 1-1.1 1.99z"/>
      </svg>
      Open playlist in Spotify
    </a>
  </div>
</div>

<!-- External JavaScript -->
 <script src="spotify-player.js"></script>
<script src="script.js"></script>
</body>
</html>
